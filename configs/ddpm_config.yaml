dataset: cifar10
image_size: 32
in_channels: 3

base_channels: 64
channel_mult: [1, 2, 4, 4]
num_res_blocks: 2
attention_resolutions: [16]
time_emb_dim: 256
dropout: 0.1

timesteps: 1000
beta_start: 0.0001
beta_end: 0.02
beta_schedule: linear

learning_rate: 0.0001
optimizer: adam
batch_size: 64
training_steps: 150000

ema_decay: 0.999

mixed_precision: false

save_every: 10000
sample_every: 5000
num_samples: 64
num_eval_samples: 10000

seed: 42
